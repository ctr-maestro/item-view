<style>
/* 색 토큰은 Record Viewer(rankstats.html)와 같다 */
:root {
  color-scheme: light;
  --bg: #f4f5f7; --surface: #ffffff; --surface-2: #f2f3f5; --surface-3: #e9eaee;
  --border: #e4e5e9; --text: #0d0e12; --text-2: #50535c; --muted: #8a8d96;
  --accent: #2a78d6; --accent-soft: #e6effb; --good: #0f8a5f; --gold: #c99400;
  --shadow: 0 1px 2px rgb(16 24 40 / .04), 0 4px 16px rgb(16 24 40 / .06);
  --glass: rgb(244 245 247 / .8);
  --tip-bg: #15171c; --tip-border: #353841; --tip-text: #e8e9ec; --tip-abil: #6fdc8c; --tip-limit: #f2cf4a; --tip-exp: #b9bcc6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e0f12; --surface: #17181c; --surface-2: #1f2025; --surface-3: #2a2b31;
    --border: #2b2c33; --text: #f4f5f7; --text-2: #b9bbc3; --muted: #80838d;
    --accent: #3987e5; --accent-soft: #1b2a40; --good: #3ecf8e; --gold: #e6b93d;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
    --glass: rgb(14 15 18 / .8);
    --tip-bg: #0b0c0f;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e0f12; --surface: #17181c; --surface-2: #1f2025; --surface-3: #2a2b31;
  --border: #2b2c33; --text: #f4f5f7; --text-2: #b9bbc3; --muted: #80838d;
  --accent: #3987e5; --accent-soft: #1b2a40; --good: #3ecf8e; --gold: #e6b93d;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
  --glass: rgb(14 15 18 / .8);
  --tip-bg: #0b0c0f;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 "Pretendard Variable", Pretendard, "Malgun Gothic", system-ui, sans-serif; letter-spacing: -0.01em; }
.mono { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
.hidden { display: none !important; }
button, select, input { font: inherit; color: inherit; letter-spacing: inherit; }
a { color: var(--accent); text-decoration: none; }

/* hero */
.hero { padding: 36px 0 20px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 14px; }
.logo { height: 42px; width: 42px; flex: none; display: block; border-radius: 8px; object-fit: cover; }
.hero h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.03em; }
.hero .meta { color: var(--text-2); font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
  background: var(--surface-3); color: var(--text-2); }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); }
.hero-actions { display: flex; gap: 8px; }
.icon-btn { height: 36px; min-width: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--text); }
.icon-btn:hover { background: var(--surface-2); }
#themeBtn .sun { display: none; }
:root[data-theme="dark"] #themeBtn .sun { display: inline; }
:root[data-theme="dark"] #themeBtn .moon { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) #themeBtn .sun { display: inline; }
  :root:not([data-theme="light"]) #themeBtn .moon { display: none; }
}

/* filter bar */
.filterbar { position: sticky; top: 0; z-index: 20; backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
  background: var(--glass); border-bottom: 1px solid transparent; transition: border-color .2s; }
.filterbar.stuck { border-bottom-color: var(--border); }
.filterbar .wrap { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-top: 10px; padding-bottom: 10px; }
.chips { display: flex; gap: 4px; padding: 3px; background: var(--surface-3); border-radius: 12px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.chips::-webkit-scrollbar { display: none; }
.chip { border: 0; background: transparent; padding: 6px 12px; border-radius: 9px; cursor: pointer; white-space: nowrap; color: var(--text-2); font-weight: 500; }
.chip.on { background: var(--surface); color: var(--text); font-weight: 700; box-shadow: 0 1px 3px rgb(0 0 0 / .1); }
.field { position: relative; display: flex; align-items: center; }
.field select, .field input { height: 38px; border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 0 12px; outline: none; }
.field select { padding-right: 30px; appearance: none; -webkit-appearance: none; width: 150px; cursor: pointer; text-overflow: ellipsis; }
.field.sel::after { content: ""; position: absolute; right: 12px; width: 7px; height: 7px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
  transform: translateY(-2px) rotate(45deg); pointer-events: none; }
.field select:focus, .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field.search { flex: 1; min-width: 180px; }
.field.search input { width: 100%; padding-left: 34px; }
.field.search svg { position: absolute; left: 11px; color: var(--muted); }
.toggle { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); cursor: pointer; color: var(--text-2); white-space: nowrap; user-select: none; }
.toggle input { accent-color: var(--accent); margin: 0; }
.seg { display: inline-flex; padding: 3px; background: var(--surface-3); border-radius: 10px; }
.seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 8px; cursor: pointer; color: var(--text-2); }
.seg button.on { background: var(--surface); color: var(--text); font-weight: 700; box-shadow: 0 1px 3px rgb(0 0 0 / .1); }
.reset { color: var(--accent); background: none; border: 0; cursor: pointer; font-weight: 600; padding: 6px 4px; }
@media (max-width: 640px) { .field select { width: calc(50vw - 26px); } .filterbar .wrap { gap: 8px; padding-top: 8px; padding-bottom: 8px; } }

/* list */
main { padding: 16px 0 48px; }
.count { color: var(--text-2); font-size: 13px; margin: 0 2px 12px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.count .note { color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.it { display: flex; gap: 12px; align-items: center; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; cursor: pointer; min-width: 0; transition: border-color .15s, transform .15s; text-align: left; color: var(--text); }
.it:hover { border-color: var(--accent); transform: translateY(-1px); }
.ico { position: relative; width: 48px; height: 48px; flex: none; border-radius: 10px; background: var(--surface-3); display: grid; place-items: center; overflow: hidden; }
.ico .car { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 2px; background: rgb(0 0 0 / .72); color: #fff; font-size: 9px; font-weight: 700;
  line-height: 13px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0; }
.ico.sm .car { display: none; }
.ico.lg .car { font-size: 11px; line-height: 16px; }
.carimg { height: 56px; border-radius: 8px; display: block; }
.ico img { max-width: 100%; max-height: 100%; image-rendering: auto; }
.ico.sm { width: 32px; height: 32px; border-radius: 8px; }
.ico.lg { width: 64px; height: 64px; border-radius: 12px; }
.ico .none { color: var(--muted); font-size: 11px; }
.it .body { min-width: 0; flex: 1; }
.it .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.it .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.it .st { display: flex; gap: 6px; margin-top: 3px; flex-wrap: wrap; }
.pill { font-size: 11.5px; padding: 1px 7px; border-radius: 999px; background: var(--surface-3); color: var(--text-2); white-space: nowrap; }
.pill b { color: var(--text); font-weight: 700; }
.cls { font-size: 11px; font-weight: 800; padding: 0 6px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; vertical-align: 1px; }
.more { display: block; margin: 16px auto 0; }
.empty { text-align: center; color: var(--muted); padding: 60px 0; }

/* table */
.tablewrap { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: auto; box-shadow: var(--shadow); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border); }
th { position: sticky; top: 0; background: var(--surface-2); font-size: 12px; color: var(--text-2); font-weight: 600; cursor: pointer; user-select: none; }
th.on { color: var(--accent); }
th.l, td.l { text-align: left; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
td .row { display: flex; gap: 8px; align-items: center; }
.q { color: var(--muted); }
.pos { color: var(--good); }

/* modal */
.modal { position: fixed; inset: 0; z-index: 50; background: rgb(0 0 0 / .45); display: grid; place-items: center; padding: 16px; }
.sheet { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; width: min(760px, 100%); max-height: calc(100vh - 32px);
  overflow: auto; box-shadow: 0 20px 60px rgb(0 0 0 / .35); }
.sheet-head { display: flex; gap: 14px; align-items: center; padding: 18px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0;
  background: var(--surface); z-index: 1; }
.sheet-head h2 { margin: 0; font-size: 19px; letter-spacing: -0.02em; }
.sheet-head .sub { color: var(--muted); font-size: 12.5px; }
.sheet-head .x { margin-left: auto; }
.sheet-body { padding: 18px 20px 22px; display: grid; gap: 18px; }
.sec h3 { margin: 0 0 8px; font-size: 14px; }
.sec .desc { color: var(--muted); font-size: 12px; margin: -4px 0 8px; }
.tip { background: var(--tip-bg); border: 1px solid var(--tip-border); border-radius: 10px; padding: 12px 14px; color: var(--tip-text); font-size: 13px; }
.tip .t-name { font-weight: 800; margin-bottom: 6px; }
.tip .a { color: var(--tip-abil); }
.tip .l { color: var(--tip-limit); }
.tip .x { color: var(--tip-exp); margin-top: 8px; white-space: pre-line; line-height: 1.55; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.stat .k { font-size: 11.5px; color: var(--muted); }
.stat .v { font-size: 16px; font-weight: 800; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.mat { display: flex; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 10px; cursor: pointer; }
.mat:hover { background: var(--surface-2); }
.mat .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mat .c { font-weight: 800; color: var(--text-2); }
.tree { margin-left: 22px; border-left: 1px dashed var(--border); padding-left: 8px; }
.tag { font-size: 11px; padding: 0 6px; border-radius: 6px; background: var(--surface-3); color: var(--text-2); }
.srcs { display: grid; gap: 6px; }
.src { display: flex; gap: 10px; align-items: center; padding: 8px 10px; background: var(--surface-2); border-radius: 10px; font-size: 13px; }
.src .k { font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.src .v { color: var(--text); }
.pill.price b { color: var(--gold); }
.vars { max-height: 320px; overflow: auto; border: 1px solid var(--border); border-radius: 10px; }
.vars table { font-size: 12.5px; }
.vars tr.on { background: var(--accent-soft); }
.vars td, .vars th { padding: 5px 8px; }
.foot { color: var(--muted); font-size: 12px; padding: 0 0 32px; line-height: 1.7; }
</style>

<div class="filterbar" id="filterbar">
  <div class="wrap">
    <div class="chips" id="partChips" role="tablist" aria-label="파츠"></div>
    <label class="field sel"><select id="fGroup" aria-label="분류"></select></label>
    <label class="field sel"><select id="fClass" aria-label="클래스"></select></label>
    <label class="field sel"><select id="fCar" aria-label="적용 차량"></select></label>
    <label class="field search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="fSearch" placeholder="아이템 · 차량 이름 · 코드 검색  ( / )" aria-label="아이템 검색">
    </label>
    <div class="seg" role="tablist" aria-label="보기"><button type="button" id="vCards" class="on">카드</button><button type="button" id="vTable">표</button></div>
    <button type="button" class="reset hidden" id="resetBtn">초기화</button>
  </div>
</div>

<div class="wrap">
  <main>
    <div class="count"><span id="count"></span><span class="note">게임 툴팁에 표시되는 값만 보여줍니다 · 추가옵션 포함 · 표시되지 않는 값은 ???</span></div>
    <div id="cards" class="cards"></div>
    <div id="tableWrap" class="tablewrap hidden"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    <div id="empty" class="empty hidden">조건에 맞는 아이템이 없습니다</div>
    <button type="button" class="icon-btn more hidden" id="moreBtn">더 보기</button>
  </main>
  <div class="foot" id="foot"></div>
</div>

<div class="modal hidden" id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const PAGE = 120;
let D = null, BY = new Map(), USED = new Map(), FAM = new Map(), view = "cards", shown = PAGE, sortKey = null, sortDir = -1, list = [];
const st = { part: "all", group: "", cls: "", car: "", q: "" };

// ---------------- 데이터
fetch("items.json").then(r => r.json()).then(init).catch(e => { $("#built").textContent = "데이터를 불러오지 못했습니다"; console.error(e); });

function init(data) {
  D = data;
  for (const it of D.items) BY.set(it.c, it);
  for (const [id, [n, codes]] of Object.entries(D.fams || {})) FAM.set(+id, { n, codes, items: codes.map(c => BY.get(c)).filter(Boolean) });
  for (const [bp, [, mats]] of Object.entries(D.recipes))
    for (const m of new Set(mats)) { if (m !== +bp) { if (!USED.has(m)) USED.set(m, []); USED.get(m).push(+bp); } }
  $("#built").textContent = `게임 데이터 ${D.source["itemlist.cnv"].slice(0, 10)} · 아이템 ${D.items.length.toLocaleString()}개`;
  $("#foot").innerHTML = `CTRacer 클라이언트 파일(아이템 목록 · 툴팁 · 팩토리 조합표 · 분해표)에서 만든 비공식 페이지입니다. 실제 게임 적용 값과 다를 수 있습니다.<br>`
    + `팩토리 조합 결과는 클라이언트 파일에 없어(서버가 정함) 주 재료 · 함께 넣는 재료 · 수수료만 표시합니다. 생성 ${esc(D.built.replace("T", " ").slice(0, 16))}`;
  const parts = [["all", "전체"], ...Object.entries(D.labels.part).filter(([k], i, a) => a.findIndex(x => x[1] === D.labels.part[k]) === i)];
  $("#partChips").innerHTML = parts.map(([k, v]) => `<button type="button" class="chip${k === "all" ? " on" : ""}" data-k="${k}">${esc(v)}</button>`).join("");
  $("#fClass").innerHTML = `<option value="">모든 클래스</option>` + Object.entries(D.labels.class).map(([k, v]) => `<option value="${k}">${k === "0" ? "클래스 무관" : v + " 클래스"}</option>`).join("");
  const carCount = new Map();
  for (const it of D.items) if (it.car) carCount.set(it.car, (carCount.get(it.car) || 0) + 1);
  const carOpts = Object.entries(D.cars).sort((a, b) => a[1][1] - b[1][1] || a[1][0].localeCompare(b[1][0]))
    .map(([c, [n, k]]) => `<option value="${c}">${esc(D.labels.class[k] ?? "")} · ${esc(n)} (${carCount.get(+c) || 0})</option>`);
  $("#fCar").innerHTML = `<option value="">모든 차량</option><option value="0">공용 (차량 무관)</option>` + carOpts.join("");
  fillGroups();
  bind();
  route();
  render();
}

function fillGroups() {
  const used = new Map();
  for (const it of D.items) if (st.part === "all" || samePart(it.p)) used.set(it.g, (used.get(it.g) || 0) + 1);
  const opts = [...used.keys()].sort((a, b) => a - b).map(g => `<option value="${g}">${esc(D.labels.group[g] ?? "분류 " + g)} (${used.get(g)})</option>`);
  $("#fGroup").innerHTML = `<option value="">모든 분류</option>` + opts.join("");
  $("#fGroup").value = used.has(+st.group) ? st.group : (st.group = "");
}
const samePart = p => D.labels.part[p] === D.labels.part[st.part];

// ---------------- 필터 / 정렬
function filtered() {
  const q = st.q.trim().toLowerCase().replace(/\s+/g, " ");
  return D.items.filter(it => (st.part === "all" || samePart(it.p))
    && (st.group === "" || it.g === +st.group)
    && (st.cls === "" || it.k === +st.cls)
    && (st.car === "" || (st.car === "0" ? !it.car : it.car === +st.car))
    && (!q || it.n.toLowerCase().includes(q) || String(it.c) === q || (it.car && carName(it).toLowerCase().includes(q))
        || (it.fm && FAM.get(it.fm).n.toLowerCase().includes(q))));
}
function range(items, stat, src) {
  // 묶음 안의 값 범위 ('+60 ~ +70'). src 를 주면 그 획득처 설명(가격) 범위
  const vals = items.map(x => stat ? sv(x, stat) : (x.src || []).find(s => s[0] === src)?.[1]).filter(v => v != null);
  if (!vals.length) return "???";
  const nums = vals.map(v => parseFloat(String(v).replace(/,/g, "").replace(/[^\d.+\-]/g, "")));
  if (nums.some(isNaN) || new Set(vals).size === 1) return vals[0];
  const lo = vals[nums.indexOf(Math.min(...nums))], hi = vals[nums.indexOf(Math.max(...nums))];
  return lo === hi ? lo : `${lo} ~ ${hi}`;
}
const statNum = v => v == null ? null : parseFloat(String(v).replace(/[^\d.+\-~]/g, "").split("~").pop());

function sorted(arr) {
  if (!sortKey) return arr;
  const key = sortKey, get = key === "name" ? it => it.n : key === "class" ? it => it.k : it => statNum(it.st?.[key]);
  return [...arr].sort((a, b) => {
    const x = get(a), y = get(b);
    if (x == null && y == null) return 0;
    if (x == null) return 1;
    if (y == null) return -1;
    return (typeof x === "string" ? x.localeCompare(y, "ko") : x - y) * sortDir;
  });
}

// ---------------- 그리기
const carName = it => (it?.car && D.cars[it.car]) ? D.cars[it.car][0] : "";
function icon(it, size = "") {
  const car = carName(it);
  return `<span class="ico ${size}">${it?.i ? `<img loading="lazy" src="icons/${esc(it.i)}.webp" alt="">` : `<span class="none">?</span>`}`
    + `${car ? `<span class="car">${esc(car)}</span>` : ""}</span>`;
}
const clsTag = it => it.k ? `<span class="cls">${esc(D.labels.class[it.k])}</span>` : "";
const groupName = it => D.labels.group[it.g] ?? "";
// 아이템 클래스가 '전체'(0)인데 전용 차량이 있으면 차량 클래스로 표시
const clsOf = it => D.labels.class[it.k || (it.car && D.cars[it.car]?.[1]) || 0] ?? "";
const sv = (it, k) => it.st?.[k] ?? null;

function render() {
  list = sorted(filtered());
  if (view === "cards" && !st.car) {
    // 차량별로 나뉜 같은 아이템은 카드 하나로 (차량 필터를 고르면 개별로)
    const seen = new Set();
    list = list.filter(it => !it.fm || (!seen.has(it.fm) && seen.add(it.fm)));
  }
  $("#count").textContent = `${list.length.toLocaleString()}개`;
  $("#empty").classList.toggle("hidden", list.length > 0);
  $("#resetBtn").classList.toggle("hidden", !(st.part !== "all" || st.group || st.cls || st.car || st.q));
  const page = list.slice(0, shown);
  $("#moreBtn").classList.toggle("hidden", list.length <= shown);
  $("#moreBtn").textContent = `더 보기 (${(list.length - shown).toLocaleString()}개 남음)`;
  if (view === "cards") {
    $("#tableWrap").classList.add("hidden");
    $("#cards").classList.remove("hidden");
    $("#cards").innerHTML = page.map(it => {
      const fam = view === "cards" && !st.car && it.fm ? FAM.get(it.fm) : null;
      const pills = D.stats.filter(k => sv(it, k) != null).slice(0, 3).map(k => `<span class="pill">${esc(k)} <b>${esc(fam ? range(fam.items, k) : sv(it, k))}</b></span>`).join("");
      if (fam) {
        const shop = (it.src || []).find(s => s[0] === "상점");
        return `<button type="button" class="it" data-c="${it.c}">${icon({ ...it, car: 0 })}<span class="body"><div class="nm">${esc(fam.n)}${clsTag(it)}</div>`
          + `<div class="sub">${esc(groupName(it))} · 차량 ${fam.items.length}종</div><div class="st">${pills}${shop ? `<span class="pill price"><b>${esc(range(fam.items, null, "상점"))}</b></span>` : ""}</div></span></button>`;
      }
      const shop = (it.src || []).find(s => s[0] === "상점");
      const fac = (shop ? `<span class="pill price"><b>${esc(shop[1])}</b></span>` : "")
        + (D.recipes[it.c] ? `<span class="pill">${esc(D.recipes[it.c][2] || "조합")}</span>` : "");
      return `<button type="button" class="it" data-c="${it.c}">${icon(it)}<span class="body"><div class="nm">${esc(it.n)}${clsTag(it)}</div>`
        + `<div class="sub">${esc(groupName(it))}${carName(it) ? " · " + esc(carName(it)) : ""}</div><div class="st">${pills}${fac}</div></span></button>`;
    }).join("");
  } else {
    $("#cards").classList.add("hidden");
    $("#tableWrap").classList.remove("hidden");
    const th = (k, label, cls = "") => `<th class="${cls}${sortKey === k ? " on" : ""}" data-sort="${esc(k)}">${esc(label)}${sortKey === k ? (sortDir < 0 ? " ↓" : " ↑") : ""}</th>`;
    $("#thead").innerHTML = `<tr>${th("name", "아이템", "l")}${th("class", "클래스")}<th class="l">분류</th><th class="l">차량</th>${D.stats.map(k => th(k, k)).join("")}</tr>`;
    $("#tbody").innerHTML = page.map(it => `<tr data-c="${it.c}"><td class="l"><span class="row">${icon(it, "sm")}${esc(it.n)}</span></td>`
      + `<td>${esc(D.labels.class[it.k] ?? "")}</td><td class="l">${esc(groupName(it))}</td><td class="l">${esc(carName(it))}</td>`
      + D.stats.map(k => { const v = sv(it, k); return v == null ? `<td class="q">???</td>` : `<td class="mono">${esc(v)}</td>`; }).join("") + `</tr>`).join("");
  }
}

// ---------------- 상세
function totals(code, n = 1, acc = new Map(), path = new Set()) {
  // 설계도 재료를 끝까지 펼친 기본 재료 수량 (설계도 자신은 제외, 순환 방지)
  const r = D.recipes[code];
  if (!r || path.has(code)) { acc.set(code, (acc.get(code) || 0) + n); return acc; }
  path.add(code);
  for (const m of r[1]) if (m !== code) totals(m, n, acc, path);
  path.delete(code);
  return acc;
}
function count(arr) { const m = new Map(); for (const x of arr) m.set(x, (m.get(x) || 0) + 1); return m; }
function matRow(code, n, extra = "") {
  const it = BY.get(code);
  return `<div class="mat" data-c="${code}">${icon(it, "sm")}<span class="n">${esc(it ? it.n : "코드 " + code)}${it ? clsTag(it) : ""} ${extra}</span><span class="c mono">×${n}</span></div>`;
}
function tree(code, depth = 0, path = new Set()) {
  const r = D.recipes[code];
  if (!r || depth > 6 || path.has(code)) return "";
  path.add(code);
  const out = [...count(r[1].filter(m => m !== code))].map(([m, n]) => {
    return matRow(m, n, BY.get(m)?.f === 2 ? `<span class="tag">설계도</span>` : "");
  }).join("");
  path.delete(code);
  return out;
}

function open(code, push = true) {
  const it = BY.get(+code);
  if (!it) return;
  const tip = it.t ? it.t.map(([k, txt, color]) => `<div class="${k === "l" ? "l" : "a"}"${color ? ` style="color:${esc(color)}"` : ""}>${esc(txt)}</div>`).join("") : `<div class="q">게임 툴팁 정보 없음</div>`;
  const stats = D.stats.map(k => {
    const v = sv(it, k), o = it.op?.[k];
    const sub = o ? [o[1] != null ? `기본 ${o[0] ?? 0} · 추가옵션 ${o[1]}${o[2] ? ` (최대 ${o[2]})` : ""}` : "", o[3] ? `획득 가능 옵션 ${o[3]}` : ""].filter(Boolean).join("<br>") : "";
    return `<div class="stat"><div class="k">${esc(k)}</div><div class="v mono${v == null ? " q" : ""}">${v == null ? "???" : esc(v)}</div>${sub ? `<div class="k" style="margin-top:2px">${sub}</div>` : ""}</div>`;
  }).join("");
  const r = D.recipes[it.c];
  let fac = "";
  if (r) {
    fac += `<div class="sec"><h3>이 아이템으로 하는 팩토리 조합${r[2] ? ` <span class="tag">${esc(r[2])}</span>` : ""}</h3>`
      + `<p class="desc">팩토리에 ${esc(it.n)} 을(를) 주 재료로 넣고 + 아래 재료 + 수수료 ${r[0].toLocaleString()} CT · 결과 아이템은 게임 서버가 정합니다 (툴팁 설명 참고)</p>${tree(it.c)}</div>`;

  }
  const used = USED.get(it.c);
  if (used) fac += `<div class="sec"><h3>다른 조합의 재료로 쓰임 <span class="tag">${used.length}</span></h3><p class="desc">주 재료 아이템 (누르면 그 조합을 봅니다)</p>${used.slice(0, 60).map(b => matRow(b, count(D.recipes[b][1]).get(it.c))).join("")}${used.length > 60 ? `<p class="desc">…외 ${used.length - 60}개</p>` : ""}</div>`;
  const kv = [["코드", it.c], ["파츠", D.labels.part[it.p]], ["분류", groupName(it)], ["클래스", D.labels.class[it.k]], ["적용 차량", carName(it) || "공용"],
    ["판매 방식", D.labels.pay[it.pay]], ["거래소", it.tr ? "등록 가능" : null], ["팩토리", D.labels.factory[it.f]], ["분해 포인트", it.d]].filter(([, v]) => v != null && v !== "");
  const carImg = it.car && D.cars[it.car]?.[2] ? `<img class="carimg" src="icons/car/${it.car}.webp" alt="${esc(carName(it))}" title="적용 차량 ${esc(carName(it))}">` : "";
  $("#sheet").innerHTML = `<div class="sheet-head">${icon(it, "lg")}<div><h2>${esc(it.n)}${clsTag(it)}</h2><div class="sub">${esc(groupName(it))}${carName(it) ? " · " + esc(carName(it)) + " 전용" : ""} · 코드 ${it.c}</div></div>${carImg}`
    + `<button type="button" class="icon-btn x" id="closeBtn" aria-label="닫기">✕</button></div><div class="sheet-body">`
    + `<div class="sec"><h3>얻는 곳</h3>${it.src ? `<div class="srcs">${it.src.map(([k, v]) => `<div class="src"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join("")}</div>`
      : `<p class="desc" style="margin:0">클라이언트 파일에 획득처 정보가 없습니다 (랜덤 상자 · 설계도 제작 결과 등은 서버에서 정해짐)</p>`}</div>`
    + famSection(it)
    + `<div class="sec"><h3>게임 툴팁</h3><div class="tip"><div class="t-name">${esc(it.n)}</div>${tip}${it.x ? `<div class="x">${esc(it.x)}</div>` : ""}</div></div>`
    + (it.s > 0 || it.st ? `<div class="sec"><h3>성능</h3><p class="desc">툴팁에 표시되는 값 · 추가옵션이 붙어 있으면 더한 값 · 표시되지 않는 값은 ???</p><div class="stats">${stats}</div></div>` : "")
    + fac + `<div class="sec"><h3>정보</h3><dl class="kv">${kv.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl></div></div>`;
  $("#modal").classList.remove("hidden");
  document.body.style.overflow = "hidden";
  $("#sheet").scrollTop = 0;
  if (push && location.hash !== "#" + it.c) history.pushState(null, "", "#" + it.c);
}
function famSection(it) {
  const fam = it.fm && FAM.get(it.fm);
  if (!fam) return "";
  const cols = D.stats.filter(k => fam.items.some(x => sv(x, k) != null));
  const rows = fam.items.map(x => {
    const shop = (x.src || []).find(s => s[0] === "상점");
    return `<tr data-c="${x.c}" class="${x.c === it.c ? "on" : ""}"><td class="l"><span class="row">${icon(x, "sm")}${esc(carName(x))}</span></td>`
      + `<td>${esc(clsOf(x))}</td>` + cols.map(k => { const v = sv(x, k); return v == null ? `<td class="q">???</td>` : `<td class="mono">${esc(v)}</td>`; }).join("")
      + `<td class="mono">${shop ? esc(shop[1]) : ""}</td></tr>`;
  }).join("");
  const opts = [...fam.items].sort((a, b) => (D.cars[a.car]?.[1] ?? a.k) - (D.cars[b.car]?.[1] ?? b.k) || carName(a).localeCompare(carName(b)))
    .map(x => `<option value="${x.c}"${x.c === it.c ? " selected" : ""}>${esc(clsOf(x))} · ${esc(carName(x))}</option>`).join("");
  return `<div class="sec"><h3>같은 아이템 · 차량 ${fam.items.length}종 <span class="tag">${esc(fam.n)}</span></h3>`
    + `<div style="display:flex;gap:10px;align-items:center;margin:0 0 8px"><label class="field sel"><select class="famSel" aria-label="차량 선택" style="width:220px">${opts}</select></label>`
    + `<span class="desc" style="margin:0">차량을 고르거나 표에서 누르면 그 차량용으로 바뀝니다</span></div>`
    + `<div class="vars"><table><thead><tr><th class="l">차량</th><th>클래스</th>${cols.map(k => `<th>${esc(k)}</th>`).join("")}<th>상점</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function close(push = true) {
  $("#modal").classList.add("hidden");
  document.body.style.overflow = "";
  if (push && location.hash) history.pushState(null, "", location.pathname + location.search);
}
function route() { const c = location.hash.slice(1); if (/^\d+$/.test(c) && BY.has(+c)) open(c, false); else close(false); }

// ---------------- 이벤트
function bind() {
  const reset = () => { shown = PAGE; render(); };
  $("#partChips").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    st.part = b.dataset.k;
    document.querySelectorAll("#partChips .chip").forEach(x => x.classList.toggle("on", x === b));
    fillGroups(); reset();
  });
  $("#fGroup").addEventListener("change", e => { st.group = e.target.value; reset(); });
  $("#fClass").addEventListener("change", e => { st.cls = e.target.value; reset(); });
  $("#fCar").addEventListener("change", e => { st.car = e.target.value; reset(); });
  let t; $("#fSearch").addEventListener("input", e => { clearTimeout(t); t = setTimeout(() => { st.q = e.target.value; reset(); }, 120); });
  $("#resetBtn").addEventListener("click", () => {
    Object.assign(st, { part: "all", group: "", cls: "", car: "", q: "" });
    $("#fSearch").value = ""; $("#fClass").value = ""; $("#fCar").value = "";
    document.querySelectorAll("#partChips .chip").forEach(x => x.classList.toggle("on", x.dataset.k === "all"));
    fillGroups(); reset();
  });
  $("#vCards").addEventListener("click", () => { view = "cards"; $("#vCards").classList.add("on"); $("#vTable").classList.remove("on"); render(); });
  $("#vTable").addEventListener("click", () => { view = "table"; $("#vTable").classList.add("on"); $("#vCards").classList.remove("on"); render(); });
  $("#thead").addEventListener("click", e => {
    const th = e.target.closest("th[data-sort]"); if (!th) return;
    const k = th.dataset.sort;
    if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = k === "name" ? 1 : -1; }
    reset();
  });
  $("#moreBtn").addEventListener("click", () => { shown += PAGE * 2; render(); });
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-c]");
    if (t && !e.target.closest("#closeBtn")) { open(t.dataset.c); return; }
    if (e.target.id === "modal" || e.target.closest("#closeBtn")) close();
  });
  document.addEventListener("change", e => { if (e.target.classList.contains("famSel")) open(e.target.value); });
  addEventListener("popstate", route);
  addEventListener("keydown", e => {
    if (e.key === "Escape" && !$("#modal").classList.contains("hidden")) close();
    if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); $("#fSearch").focus(); }
  });
  new IntersectionObserver(([en]) => $("#filterbar").classList.toggle("stuck", en.intersectionRatio < 1),
    { threshold: [1], rootMargin: "-1px 0px 0px 0px" }).observe($("#filterbar"));
}

// 테마 (Record Viewer 와 같은 저장 키 -- 같은 도메인이라 선택이 공유된다)
function applyTheme(t) { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
try { applyTheme(localStorage.getItem("ctr-theme")); } catch (_) {}
$("#themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.dataset.theme;
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(dark ? "light" : "dark");
  try { localStorage.setItem("ctr-theme", dark ? "light" : "dark"); } catch (_) {}
});
</script>
</body>
